<!doctype html>

    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <script>
      // Suppress benign Vite HMR WebSocket connection notices per AI Studio environment constraints
      (function() {
        const origError = console.error;
        console.error = function(...args) {
          if (
            args.length > 0 &&
            typeof args[0] === 'string' &&
            (args[0].includes('[vite] failed to connect to websocket') ||
             args[0].includes('[vite] server connection lost') ||
             args[0].includes('[vite] connecting'))
          ) {
            return;
          }
          origError.apply(console, args);
        };
      })();
    </script>
    <title>Yaawp</title>
