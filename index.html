<!doctype html>
<html lang="en" class="dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <script>
      // Suppress benign Vite HMR WebSocket connection notices per AI Studio environment constraints
      (function() {
        // 1. Mock WebSocket for Vite HMR to prevent failing network connections in Cloud Run iframe
        try {
          var OrigWebSocket = window.WebSocket;
          if (OrigWebSocket) {
            function MockWebSocket(url, protocols) {
              var isViteHmr = false;
              if (protocols === 'vite-hmr') isViteHmr = true;
              if (Array.isArray(protocols) && protocols.indexOf('vite-hmr') !== -1) isViteHmr = true;
              if (typeof url === 'string' && (url.indexOf('token=') !== -1 || url.indexOf('vite') !== -1 || url.indexOf('/@vite') !== -1)) isViteHmr = true;

              if (isViteHmr) {
                var dummy = new EventTarget();
                dummy.url = url;
                dummy.protocol = 'vite-hmr';
                dummy.readyState = 1; // WebSocket.OPEN
                dummy.CONNECTING = 0;
                dummy.OPEN = 1;
                dummy.CLOSING = 2;
                dummy.CLOSED = 3;
                dummy.send = function() {};
                dummy.close = function() {
                  dummy.readyState = 3;
                  try {
                    dummy.dispatchEvent(new Event('close'));
                  } catch(e) {}
                };
                setTimeout(function() {
                  try {
                    dummy.dispatchEvent(new Event('open'));
                  } catch(e) {}
                }, 0);
                return dummy;
              }
              return new OrigWebSocket(url, protocols);
            }
            MockWebSocket.prototype = OrigWebSocket.prototype;
            MockWebSocket.CONNECTING = 0;
            MockWebSocket.OPEN = 1;
            MockWebSocket.CLOSING = 2;
            MockWebSocket.CLOSED = 3;
            window.WebSocket = MockWebSocket;
          }
        } catch(e) {}

        // 2. Comprehensive console and error interception for [vite]
        function hasViteToken(val) {
          if (!val) return false;
          if (typeof val === 'string') {
            var lower = val.toLowerCase();
            return lower.indexOf('[vite]') !== -1 || lower.indexOf('@vite') !== -1 || lower.indexOf('vite-hmr') !== -1 || lower.indexOf('websocket') !== -1;
          }
          if (typeof val === 'object') {
            var msg = (val.message || '') + ' ' + (val.stack || '') + ' ' + (val.reason || '');
            var lowerMsg = msg.toLowerCase();
            return lowerMsg.indexOf('[vite]') !== -1 || lowerMsg.indexOf('@vite') !== -1 || lowerMsg.indexOf('vite-hmr') !== -1 || lowerMsg.indexOf('websocket') !== -1;
          }
          return false;
        }

        function shouldSuppress(args) {
          if (!args || !args.length) return false;
          for (var i = 0; i < args.length; i++) {
            if (hasViteToken(args[i])) return true;
          }
          return false;
        }

        var origError = console.error;
        console.error = function() {
          var args = Array.prototype.slice.call(arguments);
          if (shouldSuppress(args)) return;
          origError.apply(console, arguments);
        };

        var origWarn = console.warn;
        console.warn = function() {
          var args = Array.prototype.slice.call(arguments);
          if (shouldSuppress(args)) return;
          origWarn.apply(console, arguments);
        };

        var origInfo = console.info;
        console.info = function() {
          var args = Array.prototype.slice.call(arguments);
          if (shouldSuppress(args)) return;
          origInfo.apply(console, arguments);
        };

        var origLog = console.log;
        console.log = function() {
          var args = Array.prototype.slice.call(arguments);
          if (shouldSuppress(args)) return;
          origLog.apply(console, arguments);
        };

        window.addEventListener('error', function(e) {
          if (e && (
            hasViteToken(e.message) ||
            hasViteToken(e.filename) ||
            (e.error && hasViteToken(e.error.message))
          )) {
            e.preventDefault();
            if (e.stopImmediatePropagation) e.stopImmediatePropagation();
          }
        }, true);

        window.addEventListener('unhandledrejection', function(e) {
          var reason = e && e.reason;
          if (hasViteToken(reason)) {
            e.preventDefault();
            if (e.stopImmediatePropagation) e.stopImmediatePropagation();
          }
        }, true);
      })();
    </script>
    <title>Yaawp</title>

    <meta property="og:title" content="Yaawp" />
